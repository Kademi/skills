name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Marketplace entries resolve to real plugins, manifests agree on name,
      # declared assets exist, rules and skills are well formed.
      - name: Validate plugin structure
        run: node scripts/validate-plugins.mjs

      # Every skill against the Agent Skills spec.
      - name: Validate skills
        run: |
          status=0
          for skill in plugins/*/skills/*/; do
            npx -y skills-ref validate "./$skill" || status=1
          done
          exit $status
